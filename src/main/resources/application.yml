server:
  error:
    include-stacktrace: on_param

spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/pap?useSSL=false&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: update

# JWT signing — REQUIRED. Generate one with:
#   openssl rand -base64 48
jwt:
  secret: ${JWT_SECRET}
  expirationDateInMs: ${JWT_EXPIRATION_MS:86400000}

logging:
  level:
    org:
      hibernate:
        SQL: info
